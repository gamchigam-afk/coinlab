
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinLab | Coupon</title>
<style>
:root{
  --bg:#f5f7fb;
  --panel:#fff;
  --text:#182235;
  --muted:#788398;
  --line:#e3e8f0;
  --accent:#3678f5;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:grid;place-items:center;
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif
}
.app{width:100%;max-width:420px}
header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:20px
}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--accent)}
.tag{
  padding:6px 10px;border-radius:20px;
  background:#eaf1ff;color:var(--accent);font-size:11px
}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:23px;
  box-shadow:0 12px 35px #243b6010
}
.icon{
  width:58px;height:58px;border-radius:17px;
  display:grid;place-items:center;
  background:#eaf1ff;font-size:30px;margin-bottom:17px
}
h1{font-size:24px;margin:0 0 9px}
.desc{font-size:14px;line-height:1.7;color:var(--muted)}
.reward{
  padding:16px;border-radius:13px;
  background:#effaf4;border:1px solid #d2f0df;
  margin:20px 0
}
.reward small{color:#32845b}
.reward strong{
  display:block;color:#168451;font-size:29px;margin-top:4px
}
label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}
input{
  width:100%;padding:13px;border:1px solid var(--line);
  border-radius:11px;background:white;color:var(--text);
  font-size:16px;outline:none;text-transform:uppercase
}
input:focus{border-color:var(--accent)}
button{
  width:100%;padding:14px;margin-top:11px;border:0;
  border-radius:11px;background:var(--accent);color:white;
  font-size:15px;font-weight:800;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.message{min-height:25px;margin-top:14px;font-size:13px;line-height:1.6}
.success{color:#168451}
.error{color:#d74452}
.balance{
  margin-top:16px;padding:13px;border-radius:12px;
  background:var(--bg);font-size:13px;color:var(--muted)
}
.balance strong{color:var(--text)}
.back{
  display:block;text-align:center;margin-top:19px;
  color:var(--muted);font-size:13px;text-decoration:none
}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🪙 COIN<span>LAB</span></div>
    <div class="tag">COUPON EVENT</div>
  </header>

  <section class="card">
    <div class="icon">🎁</div>
    <h1>쿠폰 교환</h1>
    <p class="desc">
      특별 쿠폰을 입력하고 보상을 받아 보세요.
      이 쿠폰은 브라우저당 한 번만 사용할 수 있습니다.
    </p>

    <div class="reward">
      <small>쿠폰 보상</small>
      <strong>+50,000 COIN</strong>
    </div>

    <form id="couponForm">
      <label for="couponInput">쿠폰 코드</label>
      <input id="couponInput" placeholder="COIN50000"
             maxlength="40" autocomplete="off" required>
      <button id="redeemButton">쿠폰 사용하기</button>
    </form>

    <div id="message" class="message" role="status"></div>

    <div class="balance">
      현재 잔액: <strong id="balanceDisplay">확인 중...</strong>
    </div>

    <a class="back" href="./index.html">← 코인랩으로 돌아가기</a>
  </section>

  <footer>COINLAB · Coupon Center</footer>
</div>

<script>
(() => {
  "use strict";

  const BALANCE_KEY = "coinlab_balance";
  const USED_KEY = "coinlab_used_coupons";
  const COUPON_CODE = "COIN50000";
  const REWARD = 50000;

  const form = document.getElementById("couponForm");
  const input = document.getElementById("couponInput");
  const button = document.getElementById("redeemButton");
  const message = document.getElementById("message");
  const display = document.getElementById("balanceDisplay");

  function readBalance() {
    const raw = localStorage.getItem(BALANCE_KEY);

    if (raw === null) {
      return { ok: false, value: 0 };
    }

    const value = Number(raw);

    if (!Number.isSafeInteger(value) || value < 0) {
      return { ok: false, value: 0 };
    }

    return { ok: true, value };
  }

  function refreshBalance() {
    const result = readBalance();

    display.textContent = result.ok
      ? result.value.toLocaleString("ko-KR") + " COIN"
      : "잔액 확인 불가";
  }

  function show(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  refreshBalance();

  form.addEventListener("submit", event => {
    event.preventDefault();

    if (input.value.trim().toUpperCase() !== COUPON_CODE) {
      show("❌ 올바르지 않은 쿠폰 코드입니다.", "error");
      return;
    }

    let used;

    try {
      used = JSON.parse(localStorage.getItem(USED_KEY) || "[]");
      if (!Array.isArray(used)) {
        show("저장된 쿠폰 기록을 확인할 수 없습니다.", "error");
        return;
      }
    } catch {
      show("쿠폰 기록을 읽지 못했습니다.", "error");
      return;
    }

    if (used.includes(COUPON_CODE)) {
      show("⚠️ 이미 사용한 쿠폰입니다.", "error");
      return;
    }

    const current = readBalance();

    if (!current.ok) {
      show(
        "기존 코인랩 잔액을 확인할 수 없습니다. 먼저 코인랩을 열어 잔액을 저장해 주세요.",
        "error"
      );
      return;
    }

    const nextBalance = current.value + REWARD;

    if (!Number.isSafeInteger(nextBalance)) {
      show("잔액 범위를 초과했습니다.", "error");
      return;
    }

    button.disabled = true;

    try {
      // 잔액을 먼저 저장합니다.
      localStorage.setItem(BALANCE_KEY, String(nextBalance));

      // 잔액 저장 성공 후 사용 기록을 남깁니다.
      used.push(COUPON_CODE);
      localStorage.setItem(USED_KEY, JSON.stringify(used));

      refreshBalance();
      input.disabled = true;

      show("🎉 50,000 COIN 지급 완료!", "success");
    } catch {
      show(
        "저장에 실패했습니다. 코인랩에서 잔액을 확인해 주세요.",
        "error"
      );
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
